<div class="card" *ngIf="card" [ngClass]="[selected ? 'card-selected' : '']">
  <span>Form: {{ card.shape }}</span>
  <span>Color: {{ card.color }}</span>
  <br />
  <span>Count: {{ card.count }}</span>
  <span>Background: {{ card.background }}</span>
  <div
    [ngClass]="getCardStyle(card)"
    *ngFor="let i of fillArray(card.count + 1)"
  ></div>
</div>
