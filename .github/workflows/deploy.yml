# Build the game and deploy it to Cloudflare Pages (project trio-game, https://trio.cylfox.com).
# Needs the CLOUDFLARE_API_TOKEN secret (Cloudflare Pages: Edit) and the CLOUDFLARE_ACCOUNT_ID
# variable. Without the token the game is built and tested but not deployed.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      # Uses the wrangler from package.json (already installed by npm ci).
      - name: Deploy
        if: env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist --project-name=trio-game
          --branch="$GITHUB_REF_NAME" --commit-hash="$GITHUB_SHA"
          --commit-message="$GITHUB_EVENT_NAME ${GITHUB_SHA::7}"

      - name: Skip deploy (no CLOUDFLARE_API_TOKEN)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::Built and tested but not deployed. Set the CLOUDFLARE_API_TOKEN repository secret."
